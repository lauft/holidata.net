name: Add locale

on:
  workflow_dispatch:
    inputs:
      locale:
        description: "Locale in format [a-z]{2}-[A-Z]{2}"
        required: true

concurrency:
  group: "update-locale"
  cancel-in-progress: false

jobs:
  create-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check locale format
        run: |
          if ! grep -qE "^[a-z]{2}-[A-Z]{2}$" <<< "${{ github.event.inputs.locale }}" ; then
            echo "Error: Locale '${{ github.event.inputs.locale }}' does not match the required format '[a-z]{2}-[A-Z]{2}'!"
            exit 1
          fi

      - name: Setup locale folder
        run: |
          if [[ -d "holidata/${{ github.event.inputs.locale }}" ]] ; then
            echo "Error: Locale folder '${{ github.event.inputs.locale }}' already exists!"
            exit 1
          fi
          mkdir "holidata/${{ github.event.inputs.locale }}"

      - name: Set up Python environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install holidata

      - name: Add locale
        run: |
          LOCALE_DIR="holidata"
          years=( "2011" "2023" )
          locale="${{ github.event.inputs.locale }}"
          formats=( "json" "yaml" "xml" "csv" )
          
          for year in "${years[@]}" ; do
            echo "Generating locale '${locale}' files for ${year}..."
            for format in "${formats[@]}" ; do
              echo "Generating ${locale}/${year}.${format}"
              holidata --year="${year}" --locale="${locale}" --output="${format}" > "${LOCALE_DIR}/${locale}/${year}.${format}"
            done
          
            echo "Generated locale ${locale} for year ${year}"
        
            git add "${LOCALE_DIR}/${locale}"
            git commit -m "Add holidays for ${locale} ${year}" || exit 1
          done
        continue-on-error: false

